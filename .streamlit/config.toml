[theme]
base = "dark"
primaryColor = "#FF78B7"
backgroundColor = "#080D1D"
secondaryBackgroundColor = "#121D35"
textColor = "#FFFFFF"
font = "sans serif"

[client]
showSidebarNavigation = false
showErrorDetails = "none"

# Self-hosted telemetry preference. Community Cloud may override this setting;
# its privacy practices are disclosed separately in the in-app privacy notice.
[browser]
gatherUsageStats = false
