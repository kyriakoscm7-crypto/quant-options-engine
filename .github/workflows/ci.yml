name: Quant Intelligence review gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    name: PostgreSQL Ledger Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: earnings_isolated
          POSTGRES_PASSWORD: synthetic-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EARNINGS_TEST_DATABASE_URL: postgresql://qi_earnings_runtime:synthetic-ci-runtime@127.0.0.1:5432/earnings_isolated
      EARNINGS_TEST_DATABASE_MARKER: qi-isolated-earnings-test:github-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Provision disposable CI database and restricted runtime role
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg
          with psycopg.connect("postgresql://postgres:synthetic-ci-admin@127.0.0.1:5432/earnings_isolated") as db:
              db.execute(Path("db/earnings_postgres.sql").read_text())
              db.execute("COMMENT ON DATABASE earnings_isolated IS 'qi-isolated-earnings-test:github-ci'")
              db.execute("CREATE ROLE qi_earnings_runtime LOGIN PASSWORD 'synthetic-ci-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS")
              db.execute("GRANT CONNECT ON DATABASE earnings_isolated TO qi_earnings_runtime")
              db.execute("GRANT USAGE ON SCHEMA public TO qi_earnings_runtime")
              db.execute("GRANT SELECT, INSERT, UPDATE ON earnings_budget, earnings_weeks TO qi_earnings_runtime")
              assert not db.execute("SELECT has_table_privilege('qi_earnings_runtime', 'earnings_budget', 'DELETE')").fetchone()[0]
              assert not db.execute("SELECT has_schema_privilege('qi_earnings_runtime', 'public', 'CREATE')").fetchone()[0]
          PY
      - name: Exercise concurrent reservations and fresh-process persistence
        run: python -m pytest tests/test_earnings_postgres_provider.py -q
  test:
    name: Python Quality, Tests, and Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app tests dashboard qa scripts/api_smoke.py scripts/scan_secret_history.py scripts/release_manifest.py
      - run: python -m pytest tests -q --cov=app --cov=dashboard --cov-report=term-missing
      - run: QI_API_MODE=development python qa/independent_checks.py
      - run: python -m pip_audit -r requirements.lock
      - run: python -m bandit -r app dashboard -ll
      - run: python scripts/scan_secret_history.py
      - name: Record reviewed source and runtime
        run: python scripts/release_manifest.py > release-record.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-record-${{ github.sha }}
          path: release-record.json
      - name: Real browser regression
        run: |
          python -m playwright install --with-deps chromium
          python -m streamlit run dashboard/main.py --server.address 127.0.0.1 --server.port 18501 --server.headless true > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18501/_stcore/health && break
            sleep 1
          done
          python qa/discover_navigation_browser.py --base http://127.0.0.1:18501 --channel '' --output /tmp/qi-browser/discover-navigation
          python qa/browser_acceptance.py --channel '' --output /tmp/qi-browser
          python -m streamlit run qa/discover_preview.py --server.address 127.0.0.1 --server.port 18503 --server.headless true > /tmp/discover-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18503/_stcore/health && break
            sleep 1
          done
          python qa/discover_browser.py --base http://127.0.0.1:18503 --channel '' --output /tmp/qi-browser/discover
          QI_QA_FACTORS=1 python -m streamlit run qa/discover_preview.py --server.address 127.0.0.1 --server.port 18514 --server.headless true > /tmp/factor-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18514/_stcore/health && break
            sleep 1
          done
          python qa/factor_browser.py --channel ''
          python -m streamlit run qa/news_events_preview.py --server.address 127.0.0.1 --server.port 18502 --server.headless true > /tmp/news-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18502/_stcore/health && break
            sleep 1
          done
          python qa/news_events_browser.py --channel '' --output /tmp/qi-browser/news
          python -m streamlit run qa/earnings_preview.py --server.address 127.0.0.1 --server.port 18525 --server.headless true > /tmp/earnings-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18525/_stcore/health && break
            sleep 1
          done
          python qa/earnings_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-acceptance
          path: /tmp/qi-browser
  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build immutable source image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t qi-review .
      - name: Production must reject missing token at startup
        run: |
          if docker run --rm qi-review python -c 'import app.api.main'; then
            echo 'ERROR: missing production token was accepted'
            exit 1
          fi
      - name: Protected API smoke
        run: |
          export QI_SMOKE_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          docker run --detach --name qi-ci --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 -e QI_API_TOKEN="$QI_SMOKE_TOKEN" qi-review
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health && break
            sleep 1
          done
          python scripts/api_smoke.py
          docker inspect --format '{{.Image}}' qi-ci > image-id.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-image-id
          path: image-id.txt
      - if: always()
        run: docker rm --force qi-ci || true
